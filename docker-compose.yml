services:
  db:
    image: postgres:16-alpine
    container_name: contabilis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contabilis
      POSTGRES_PASSWORD: contabilis
      POSTGRES_DB: contabilis
    ports:
      - "5432:5432"
    volumes:
      - contabilis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabilis -d contabilis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contabilis_pgdata:
